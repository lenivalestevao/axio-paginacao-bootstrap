<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>axio-paginacao-bootstrap — Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <h1 class="h3 mb-1">axio-paginacao-bootstrap</h1>
    <p class="text-secondary">Paginação para tabelas com Bootstrap 5.3, sem jQuery.</p>

    <div class="d-flex flex-wrap gap-3 align-items-center mb-3">
      <label class="d-flex align-items-center gap-2">Linhas por página
        <select id="perPage" class="form-select form-select-sm w-auto">
          <option>5</option><option selected>10</option><option>25</option>
        </select>
      </label>
      <button id="add" class="btn btn-sm btn-outline-primary">Adicionar 20 linhas</button>
      <span id="info" class="text-secondary small ms-auto"></span>
    </div>

    <div class="card shadow-sm">
      <table id="tabela" class="table table-hover mb-0">
        <thead class="table-light"><tr><th style="width:6rem">#</th><th>Nome</th><th>Cidade</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <nav id="paginacao" class="mt-3"></nav>

    <pre class="bg-white border rounded p-3 mt-4 small"><code>const pag = new AxioPaginacao('#tabela', {
  pagerSelector: '#paginacao',
  perPage: 10,
  align: 'center'
});</code></pre>
  </main>

  <script src="axio.paginacao.min.js"></script>
  <script>
    const nomes = ['Ana','Bruno','Carla','Diego','Elisa','Felipe','Gabriela','Hugo','Isabela','João'];
    const cidades = ['Curitiba','Porto Alegre','Florianópolis','Londrina','Joinville','Maringá'];
    const tbody = document.querySelector('#tabela tbody');
    let n = 0;
    function add(qtd) {
      for (let i = 0; i < qtd; i++, n++) {
        tbody.insertAdjacentHTML('beforeend',
          `<tr><td>${n + 1}</td><td>${nomes[n % nomes.length]} ${n + 1}</td><td>${cidades[n % cidades.length]}</td></tr>`);
      }
    }
    add(137);

    const info = document.getElementById('info');
    const pag = new AxioPaginacao('#tabela', {
      pagerSelector: '#paginacao',
      perPage: 10,
      align: 'center',
      onChange: atualiza
    });
    function atualiza() { info.textContent = `Página ${pag.page} de ${pag.totalPages} · ${n} registros`; }
    atualiza();

    document.getElementById('perPage').addEventListener('change', e => { pag.setPerPage(e.target.value); atualiza(); });
    document.getElementById('add').addEventListener('click', () => { add(20); pag.refresh(); atualiza(); });
  </script>
</body>
</html>
